[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "event-driven-backtesting-engine"
version = "1.0.0"
description = "Deterministic quote-driven trading simulation"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
backtest = "backtest.cli:main"

[tool.setuptools.packages.find]
include = ["backtest*"]
